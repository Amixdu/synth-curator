# synth-curator: single input config.
# Keys map 1:1 to SynthCurator(...) arguments, except the "metrics:" section, which is a nested
# instance/distributional split for readability - it's flattened into one list before use.
# Values shown are ISIC-2018 / dermoscopy examples: replace them with your own domain's.

# ---------------------------------------------------------------- run

# Full path only for now: give it raw images (inputs.synthetic_dir + real_dir + resolution) and a
# model, and it derives weights from a tournament, then curates. Each individual step still runs
# only if its output is missing.

# Every step writes here; a step is skipped if its output exists (resume).
workdir: runs/isic_run1

# Base seed for the whole run: curation draw seed, and tournament seeds are seed .. seed+random_seeds_per_metric_set-1.
seed: 0

# Your classifier. The library never trains anything: it's a Python class with
# `train_and_evaluate(train_manifest, seed) -> DataFrame[unique_image_id, true_label, predicted_label]`
# (see synth_curator.model_interface.Model). One SynthCurator run is scoped to one model - if you
# want to compare classifiers, use a separate workdir + config per model.
#
# Config route: `trainer` is a dotted path 'package.module:ClassOrFactory', called with **params.
# Python route: SynthCurator(..., model=MyModel()) and leave this block out.
# Required.
model:
  trainer: my_project.training:MyModel
  params: {}

  # Optional: run the tournament's training jobs across GPU workers instead of one after another.
  # Set this and `trainer` is called once PER WORKER as MyModel(**params, gpu_id=<id>) instead of
  # once overall - MyModel needs to accept that gpu_id keyword and put itself on that device.
  # gpu_ids: [0, 1, 2, 3]

# ---------------------------------------------------------------- inputs
# All three required (metadata_csv and pool_workdir below is optional).
inputs:
  # <class_name>/**/<image>, absolute paths used in the final manifest.
  synthetic_dir: /path/to/synthetic_pool

  # <class_name>/<image>. The reference set for distributional metrics.
  real_dir: /path/to/real_train

  # The SYNTHETIC pool's generation resolution. Real images are Lanczos-resized to this.
  # Set to whatever your generator produced.
  resolution: 512

  # Optional: filename/target_class_label CSV instead of scanning synthetic_dir for classes.
  # metadata_csv: /path/to/metadata.csv

  # Optional: cache for steps 1-3 only (standardize/features/metrics). Defaults to workdir - set
  # this to one shared path across a sweep of workdirs to
  # avoid re-standardizing/re-extracting/re-scoring the same synthetic_dir/real_dir every time.
  # pool_workdir: /path/to/shared_pool

# Class proportions (percent, must sum to ~100). The curated set matches this per class.
target_distribution:
  AKIEC: 3.27
  BCC: 5.13
  BKL: 10.97
  DF: 1.15
  MEL: 11.11
  NV: 66.95
  VASC: 1.42

# ---------------------------------------------------------------- metrics (steps 3-4)
# Instance metrics are scored per image. Distributional metrics are scored per set / generation group.
# Each metric becomes its own curated dataset (a "metric set") in the tournament, so this list =
# number of metric sets (+1 random control).
metrics:
  instance:
    - clip_log_odds_score
    - fscs_score
    - clip_similarity_cancer
    - clip_similarity_artifact
    - lpips_score
    - fsim_score
    - brisqe_score
    - psnr_score
    - ssim_score
    - diversity_score
    - realism_score
    - is_contribution_score
  distributional:
    - fid_inception
    - kid_dino
    - swd_dino

  # Minimum set size to score a class/group.
  dist_min_samples: {fid: 2048, kid: 256, swd: 64}

# ---------------------------------------------------------------- tournament (step 5)
# Training itself is your code: the `model` above. The tournament trains it on each
# metric's curated dataset (+ a random control) and records predictions.
tournament:
  # Repeats for distributional metrics (fid/kid/swd) and random_control only.
  # Instance metrics are deterministic and always train exactly once. Seeds used are run.seed .. run.seed+N-1.
  # 1 = a weighting signal, not a statistical claim. Raise it to average out sampling + training
  # noise for the randomized metric sets; cost scales linearly:
  #   train jobs = (instance metrics) + (distributional metrics + 1 random control) x random_seeds_per_metric_set
  random_seeds_per_metric_set: 1

  # true: ignore cached predictions and retrain everything, e.g. after changing the model.
  force_retrain: false

# ---------------------------------------------------------------- weights (step 6)
# Always derived from this run's tournament for now (no bring-your-own-weights option yet).
weights:
  # Weights ALL metrics per class, nothing zeroed; sets the instance-vs-distributional balance.
  utility_formula: worst_anchored

  # Reshapes only the distributional share among distributional metrics.
  dist_utility_formula: random_anchored

  # The beta in F-beta the tournament scores predictions with. 2.0 = F2 (favors recall over
  # precision). If your model picks its own checkpoint internally, use this same beta there too
  # so checkpoint selection and metric weighting agree. Ignored if `scoring` (below) is set.
  beta: 2.0

  # Optional: a dotted 'package.module:function' path replacing F-beta entirely with your own
  # metric (accuracy, precision, a custom cost, ...). Signature:
  #   scoring(true_labels, pred_labels, classes) -> {class_name: score}
  # Python route: SynthCurator(..., scoring=my_function) instead. Leave `beta` at 2.0 if you set
  # this - construction raises if you change both at once.
  # scoring: my_project.metrics:my_scoring_function

# ---------------------------------------------------------------- curation (step 7)
curation:
  # Images in the curated set.
  num_images: 8012

  # Sampling probability ~ exp(S/T). Low = greedy, high = near-random. 0.05 was the optimum on ISIC-2018; tune for your domain.
  temperature: 0.05

  # Columns identifying a generation group, scored per group. Distributional metrics only
  # (fid/kid/swd) - instance metrics are unaffected. Need >=2 real groups (e.g. checkpoints or
  # CFG values you actually varied) to mean anything; drop those metrics if you only have one.
  dist_group_by: [source_checkpoint_kimg, cfg_scale]

  # false: single draw (v15 default). true: draw num_blocks, pick the best per class.
  block_search: false

  # Only used when block_search: true.
  num_blocks: 1

  # ABSOLUTE cosine similarity to a real image; images above it are dropped. null disables.
  safety_max_similarity_threshold: 0.97
