[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synth-curator"          # TODO: confirm PyPI availability before release
version = "0.0.1.dev0"
description = "Utility-weighted curation of synthetic image pools: pick the subset that measurably helps your classifier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "torch"]

[project.scripts]
synth-curator = "synth_curator.cli:main"

[project.optional-dependencies]
full = ["pyyaml", "pillow", "tqdm", "torchvision", "transformers", "scikit-image", "opencv-python", "phasepack", "lpips", "brisque"]
yaml = ["pyyaml"]
dev = ["pytest", "pyyaml", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/synth_curator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Image-based metric calculators (FSIM/LPIPS/BRISQUE/CLIP) and DINOv2/InceptionV3 feature
# extraction need heavier deps: pip install synth-curator[full]
